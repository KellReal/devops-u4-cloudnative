name: Build e Deploy dos Microsserviços

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Login no Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build e Push api-dados
      run: |
        docker build -t kellreal/api-dados:latest passo1/api-dados/
        docker push kellreal/api-dados:latest

    - name: Build e Push api-consumidor
      run: |
        docker build -t kellreal/api-consumidor:latest passo1/api-consumidor/
        docker push kellreal/api-consumidor:latest