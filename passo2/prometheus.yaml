apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config-p2
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'api-dados'
        static_configs:
          - targets: ['api-dados-service:5000']
      - job_name: 'api-consumidor'
        static_configs:
          - targets: ['api-consumidor-service:5001']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-p2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-p2
  template:
    metadata:
      labels:
        app: prometheus-p2
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config-p2
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-p2-service
spec:
  type: NodePort
  selector:
    app: prometheus-p2
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30091