apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-edge-config
  namespace: edge
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
    scrape_configs:
      - job_name: 'edge-consumidor'
        static_configs:
          - targets: ['api-consumidor-edge-service:5001']
      - job_name: 'pushgateway'
        static_configs:
          - targets: ['pushgateway-edge:9091']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway-edge
  namespace: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pushgateway-edge
  template:
    metadata:
      labels:
        app: pushgateway-edge
    spec:
      containers:
      - name: pushgateway
        image: prom/pushgateway:latest
        ports:
        - containerPort: 9091
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway-edge
  namespace: edge
spec:
  selector:
    app: pushgateway-edge
  ports:
  - port: 9091
    targetPort: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-edge
  namespace: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-edge
  template:
    metadata:
      labels:
        app: prometheus-edge
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-edge-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-edge-service
  namespace: edge
spec:
  type: NodePort
  selector:
    app: prometheus-edge
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30092