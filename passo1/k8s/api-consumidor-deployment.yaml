apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-consumidor
  labels:
    app: api-consumidor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-consumidor
  template:
    metadata:
      labels:
        app: api-consumidor
    spec:
      containers:
      - name: api-consumidor
        image: kellreal/api-consumidor:latest
        ports:
        - containerPort: 5001
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 10
          periodSeconds: 10